    <meta name="theme-color" content="#f7f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        const root = document.documentElement;
        const key = 'themePreference';
        let preference = 'system';

        try {
          const stored = localStorage.getItem(key);
          if (stored === 'dark' || stored === 'light' || stored === 'system') {
            preference = stored;
          }
        } catch {
          // Storage can be unavailable; fall back to the system preference.
        }

        const prefersDark =
          typeof matchMedia === 'function' &&
          matchMedia('(prefers-color-scheme: dark)').matches;
        const mode =
          preference === 'system'
            ? prefersDark
              ? 'dark'
              : 'light'
            : preference;
        const background = mode === 'dark' ? '#090b10' : '#f7f5f8';

        root.dataset.theme = mode;
        root.dataset.themePreference = preference;
        root.style.colorScheme = mode;
        root.style.backgroundColor = background;

        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          meta.setAttribute('content', background);
        }
      })();
    </script>
