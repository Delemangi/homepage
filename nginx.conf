map $uri $cache_control {
  default "no-cache, no-store, must-revalidate";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/(favicon\.ico|favicon-96x96\.png|apple-touch-icon\.png|og-image\.jpg|web-app-manifest-192x192\.png|web-app-manifest-512x512\.png)$ "public, max-age=604800";
}

server {
  listen 8088;

  server_name localhost;
  server_tokens off;

  add_header Cache-Control $cache_control always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-nqKgZUJKcTSKi2RnMu55Mo8RSOpm9BYE/bxRhYG9Ylg=' 'sha256-XQjppmkdd2CmPJ5Tp6oxejwu0oaIHhXLl2Hd/SGHpM0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "browsing-topics=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
