map $uri $cache_control {
  default "no-cache, no-store, must-revalidate";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/(favicon\.ico|favicon-96x96\.png|apple-touch-icon\.png|og-image\.jpg|web-app-manifest-192x192\.png|web-app-manifest-512x512\.png)$ "public, max-age=604800";
}

server {
  listen 8088;

  server_name localhost;
  server_tokens off;

  add_header Cache-Control $cache_control always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # HSTS is expected from the Cloudflare/edge proxy. If this container is exposed
  # directly, add: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
