name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: github.actor == 'dependabot[bot]'
    uses: Delemangi/.github/.github/workflows/dependabot.yaml@bebef88ed98bc1b3b43ed317e8fb9efae29427db
    secrets: inherit
